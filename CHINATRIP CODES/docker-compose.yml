services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: chinatrip
      POSTGRES_PASSWORD: chinatrip
      POSTGRES_DB: chinatrip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinatrip"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://chinatrip:chinatrip@db:5432/chinatrip
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
