# =============================================================================
# CHINATRIP AI PR Review — powered by OpenCode Go (deepseek-v4.1-flash)
# Model: deepseek-v4.1-flash via https://opencode.ai/inference/go/openai/v1
#   (OpenAI wire + 两个 Go 网关硬性头：x-opencode-session / 浏览器 UA——
#   scripts/deepseek_pr_review.py provider=opencode 分支已实现)
# 2026-11-14 用户拍板切换：GLM 月度配额 429（重置 11-15 01:24），评审停摆
#   一周；OpenCode Go 订阅在约（用户 workspace wrk_01M1BSN5HKDX008F4EVMNHQNKV）。
#   API key: repo secret OPENCODE_API_KEY。
# Rollback: GLM key 仍在 repo secret GLM_API_KEY——env 四行换回即可。
# Trigger: PR opened / synchronize / reopened + manual dispatch
# =============================================================================

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "rules/**"
      - "skills/**"
      - "prompts/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: deepseek-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: GLM Flash Review
    runs-on: ubuntu-latest
    # 网络瞬断重试 (3 次 + 退避) 最坏 ~16min, 10min 会在重试中途杀掉作业
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI PR Review
        env:
          # OpenCode Go — primary provider（2026-11-14 用户拍板：GLM 月度
          # 配额 429 评审停摆一周，切 Go 订阅 deepseek-v4.1-flash）。
          LLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LLM_MODEL: deepseek-v4.1-flash
          LLM_BASE_URL: https://opencode.ai/inference/go/openai/v1
          LLM_PROVIDER: opencode
          # Rollback（GLM 恢复后四行换回）：LLM_API_KEY=${{ secrets.GLM_API_KEY }}
          #   LLM_MODEL=glm-5.3-flash
          #   LLM_BASE_URL=https://open.bigmodel.cn/api/coding/paas/v4
          #   LLM_PROVIDER=glm
          # GitHub token for posting review comments
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: python scripts/deepseek_pr_review.py


